backend:
  name: github
  repo: simondiaz-marketing/simon-diaz-portafolio-de-servicios
  branch: main
  base_url: https://simondiaz-marketing.vercel.app
  auth_endpoint: api/auth

media_folder: "img"
public_folder: "/img"

collections:
  - name: "configuracion_contenido"
    label: "Gestión de Contenidos"
    delete: false
    editor:
      preview: false
    files:
      - file: "data/services.json"
        label: "Servicios Ofrecidos"
        name: "services"
        fields:
          - label: "Servicios"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID Único (ej: marketing-digital)", name: "id", widget: "string" }
              - { label: "Título del Servicio", name: "title", widget: "string" }
              - { label: "Categoría", name: "category", widget: "string" }
              - { label: "Etiqueta (Badge)", name: "badge", widget: "string" }
              - { label: "Descripción Corta", name: "shortDescription", widget: "text" }
              - { label: "Características/Prestaciones", name: "features", widget: "list", field: { label: "Característica", name: "feature", widget: "string" } }
              - { label: "Icono Lucide (ej: trending-up, video, cpu, graduation-cap)", name: "icon", widget: "string" }
              - { label: "URL de Anclaje (ej: servicios/index.html#marketing-digital)", name: "url", widget: "string" }

      - file: "data/homepage.json"
        label: "Página de Inicio (Textos)"
        name: "homepage"
        fields:
          - { label: "Título Principal", name: "hero_title", widget: "string" }
          - { label: "Subtítulo Hero", name: "hero_subtitle", widget: "text" }
          - { label: "Texto Botón Principal", name: "hero_cta_text", widget: "string" }

      - file: "data/about.json"
        label: "Sobre Mí (Biografía)"
        name: "about"
        fields:
          - { label: "Nombre", name: "title", widget: "string" }
          - { label: "Párrafo Bio 1", name: "bio_p1", widget: "text" }
          - { label: "Párrafo Bio 2", name: "bio_p2", widget: "text" }
          - { label: "Párrafo Bio 3", name: "bio_p3", widget: "text" }
          - { label: "Años de Experiencia", name: "experience_years", widget: "string" }
          - { label: "Cantidad Certificaciones", name: "certifications_count", widget: "string" }

      - file: "data/faqs.json"
        label: "Preguntas Frecuentes (FAQs)"
        name: "faqs"
        fields:
          - label: "Preguntas"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Pregunta", name: "question", widget: "string" }
              - { label: "Respuesta", name: "answer", widget: "text" }
